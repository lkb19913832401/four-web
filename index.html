<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉字谜盒 - AI字谜互动游戏</title>
<style>
  :root {
    --bg: #1a1a2e;
    --card-bg: #16213e;
    --chat-bg: #0f3460;
    --accent: #e94560;
    --gold: #f0c040;
    --text: #e0e0e0;
    --text-dim: #a0a0b0;
    --bubble-ai: #1a3a5c;
    --bubble-user: #2d5a3f;
    --input-bg: #1a1a2e;
    --border: #2a2a4a;
    --success: #4caf84;
    --warning: #f0a040;
    --error: #e94560;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'WenQuanYi Micro Hei', sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(233, 69, 96, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(240, 192, 64, 0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(76, 175, 132, 0.05) 0%, transparent 50%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
  }

  /* 背景装饰 */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.008) 2px, rgba(255,255,255,0.008) 4px);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    height: 90vh;
    max-height: 800px;
    background: var(--card-bg);
    border-radius: 24px;
    box-shadow: var(--shadow), 0 0 80px rgba(233,69,96,0.08);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ========== Header ========== */
  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .logo-icon {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, var(--accent), #c0392b);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    color: #fff;
    box-shadow: 0 4px 16px rgba(233,69,96,0.35);
    flex-shrink: 0;
  }

  .header-info h1 {
    font-size: 20px;
    font-weight: 700;
    background: linear-gradient(135deg, #fff, #e0c080);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.3;
  }

  .header-info .subtitle {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  .score-badge {
    margin-left: auto;
    background: linear-gradient(135deg, rgba(240,192,64,0.15), rgba(240,160,64,0.1));
    border: 1px solid rgba(240,192,64,0.3);
    border-radius: 12px;
    padding: 8px 14px;
    text-align: center;
    flex-shrink: 0;
  }

  .score-badge .score-num {
    font-size: 22px;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
  }

  .score-badge .score-label {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  /* ========== Chat Area ========== */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .chat-area::-webkit-scrollbar {
    width: 4px;
  }

  .chat-area::-webkit-scrollbar-track {
    background: transparent;
  }

  .chat-area::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
  }

  /* 消息气泡 */
  .message {
    display: flex;
    gap: 10px;
    animation: fadeInUp 0.4s ease-out;
    max-width: 90%;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.ai {
    align-self: flex-start;
  }

  .message.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .message .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    align-self: flex-end;
  }

  .message.ai .avatar {
    background: linear-gradient(135deg, #4a90d9, #357abd);
    box-shadow: 0 2px 10px rgba(74,144,217,0.3);
  }

  .message.user .avatar {
    background: linear-gradient(135deg, #4caf84, #388e5c);
    box-shadow: 0 2px 10px rgba(76,175,132,0.3);
  }

  .message .bubble {
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.7;
    word-break: break-word;
    position: relative;
  }

  .message.ai .bubble {
    background: var(--bubble-ai);
    border-bottom-left-radius: 6px;
    color: #d0d8e8;
    border: 1px solid rgba(74,144,217,0.15);
  }

  .message.user .bubble {
    background: var(--bubble-user);
    border-bottom-right-radius: 6px;
    color: #d0e8d8;
    border: 1px solid rgba(76,175,132,0.15);
  }

  /* 谜面卡片 */
  .riddle-card {
    background: linear-gradient(135deg, rgba(240,192,64,0.08), rgba(233,69,96,0.06));
    border: 1px solid rgba(240,192,64,0.25);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    margin: 8px 0;
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 20px rgba(240,192,64,0.05); }
    50% { box-shadow: 0 0 40px rgba(240,192,64,0.15); }
  }

  .riddle-card .riddle-label {
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .riddle-card .riddle-text {
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 2px;
    line-height: 1.5;
  }

  .riddle-card .riddle-hint-count {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  /* 提示气泡 */
  .hint-box {
    background: rgba(240,160,64,0.08);
    border: 1px dashed rgba(240,160,64,0.3);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--warning);
    margin-top: 4px;
  }

  .hint-box .hint-level {
    font-size: 10px;
    color: var(--text-dim);
    margin-bottom: 3px;
    letter-spacing: 1px;
  }

  /* 打字指示器 */
  .typing-indicator {
    display: flex;
    gap: 5px;
    padding: 8px 0;
  }

  .typing-indicator span {
    width: 7px;
    height: 7px;
    background: var(--text-dim);
    border-radius: 50%;
    animation: typingBounce 1.4s infinite;
  }

  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-8px); opacity: 1; }
  }

  /* ========== Input Area ========== */
  .input-area {
    padding: 14px 20px 18px;
    border-top: 1px solid var(--border);
    background: rgba(0,0,0,0.2);
    flex-shrink: 0;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .input-row input {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px;
    font-size: 15px;
    color: #fff;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
    font-family: inherit;
  }

  .input-row input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(233,69,96,0.15);
  }

  .input-row input::placeholder {
    color: rgba(255,255,255,0.25);
  }

  .btn {
    border: none;
    border-radius: 14px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    font-family: inherit;
    white-space: nowrap;
    letter-spacing: 1px;
  }

  .btn-send {
    background: linear-gradient(135deg, var(--accent), #c0392b);
    color: #fff;
    box-shadow: 0 4px 16px rgba(233,69,96,0.3);
  }

  .btn-send:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(233,69,96,0.45);
  }

  .btn-send:active {
    transform: translateY(0);
  }

  .btn-send:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  .action-btns {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .btn-hint {
    background: rgba(240,160,64,0.12);
    color: var(--warning);
    border: 1px solid rgba(240,160,64,0.25);
    font-size: 12px;
    padding: 8px 14px;
  }

  .btn-hint:hover {
    background: rgba(240,160,64,0.2);
  }

  .btn-skip {
    background: rgba(255,255,255,0.06);
    color: var(--text-dim);
    border: 1px solid rgba(255,255,255,0.1);
    font-size: 12px;
    padding: 8px 14px;
  }

  .btn-skip:hover {
    background: rgba(255,255,255,0.1);
  }

  .btn-new {
    background: rgba(76,175,132,0.12);
    color: var(--success);
    border: 1px solid rgba(76,175,132,0.25);
    font-size: 12px;
    padding: 8px 14px;
  }

  .btn-new:hover {
    background: rgba(76,175,132,0.2);
  }

  /* ========== 结果弹窗 ========== */
  .overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    animation: fadeIn 0.3s;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .result-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    border: 1px solid var(--border);
    max-width: 360px;
    width: 90%;
    animation: scaleIn 0.4s ease-out;
  }

  @keyframes scaleIn {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .result-card .result-icon {
    font-size: 56px;
    margin-bottom: 12px;
  }

  .result-card .result-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .result-card .result-answer {
    font-size: 48px;
    font-weight: 900;
    color: var(--gold);
    margin: 10px 0;
    text-shadow: 0 0 30px rgba(240,192,64,0.4);
  }

  .result-card .result-detail {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.7;
    margin-bottom: 20px;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #c0392b);
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 1px;
    transition: all 0.3s;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(233,69,96,0.45);
  }

  /* ========== Toast ========== */
  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--success);
    color: #fff;
    padding: 10px 24px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    z-index: 200;
    animation: toastIn 0.4s ease-out, toastOut 0.4s 2s ease-in forwards;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  @keyframes toastOut {
    from { opacity: 1; }
    to { opacity: 0; }
  }

  /* ========== 响应式 ========== */
  @media (max-width: 540px) {
    .container {
      height: 100vh;
      max-height: 100vh;
      border-radius: 0;
    }
    body { padding: 0; }
    .header { padding: 12px 16px; }
    .chat-area { padding: 14px; }
    .input-area { padding: 10px 14px 14px; }
  }
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="logo-icon">谜</div>
    <div class="header-info">
      <h1>汉字谜盒</h1>
      <div class="subtitle">AI 字谜互动游戏</div>
    </div>
    <div class="score-badge">
      <div class="score-num" id="scoreDisplay">0</div>
      <div class="score-label">积分</div>
    </div>
  </div>

  <!-- Chat Area -->
  <div class="chat-area" id="chatArea">
    <!-- 消息会动态插入这里 -->
  </div>

  <!-- Input Area -->
  <div class="input-area">
    <div class="input-row">
      <input
        type="text"
        id="guessInput"
        placeholder="输入你猜的汉字..."
        maxlength="1"
        autocomplete="off"
      >
      <button class="btn btn-send" id="btnSend" onclick="submitGuess()">发送</button>
    </div>
    <div class="action-btns">
      <button class="btn btn-hint" id="btnHint" onclick="requestHint()">💡 提示</button>
      <button class="btn btn-skip" onclick="skipRiddle()">⏭ 跳过</button>
      <button class="btn btn-new" onclick="newGame()">🔄 换一题</button>
    </div>
  </div>
</div>

<!-- Toast 容器 -->
<div id="toastContainer"></div>

<!-- 结果弹窗容器 -->
<div id="overlayContainer"></div>

// ==================== 游戏状态 ====================
const state = {
  currentRiddle: null,
  hintLevel: 0,
  score: 0,
  solved: false,
  totalAttempts: 0,
  currentAttempts: 0
};

// ==================== DOM 引用 ====================
const chatArea = document.getElementById('chatArea');
const guessInput = document.getElementById('guessInput');
const btnSend = document.getElementById('btnSend');
const btnHint = document.getElementById('btnHint');
const scoreDisplay = document.getElementById('scoreDisplay');

// ==================== 辅助函数 ====================
function scrollToBottom() {
  setTimeout(() => {
    chatArea.scrollTop = chatArea.scrollHeight;
  }, 100);
}

function showToast(msg, type = 'success') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.style.background = type === 'error' ? 'var(--error)' : 'var(--success)';
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 2500);
}

function getRandomRiddle() {
  const available = RIDDLE_DATABASE.filter(r => r.id !== state.currentRiddle?.id);
  const idx = Math.floor(Math.random() * available.length);
  return available[idx];
}

function getDifficultyLabel(d) {
  if (d === 1) return '⭐ 简单';
  if (d === 2) return '⭐⭐ 中等';
  return '⭐⭐⭐ 困难';
}

// ==================== 消息渲染 ====================
function addAIMessage(html) {
  const div = document.createElement('div');
  div.className = 'message ai';
  div.innerHTML = `
    <div class="avatar">🤖</div>
    <div class="bubble">${html}</div>
  `;
  chatArea.appendChild(div);
  scrollToBottom();
}

function addUserMessage(text) {
  const div = document.createElement('div');
  div.className = 'message user';
  div.innerHTML = `
    <div class="avatar">👤</div>
    <div class="bubble">${escapeHTML(text)}</div>
  `;
  chatArea.appendChild(div);
  scrollToBottom();
}

function addSystemMessage(text) {
  const div = document.createElement('div');
  div.style.cssText = 'text-align:center;font-size:12px;color:var(--text-dim);padding:8px 0;';
  div.textContent = text;
  chatArea.appendChild(div);
  scrollToBottom();
}

function showTypingIndicator() {
  const div = document.createElement('div');
  div.className = 'message ai';
  div.id = 'typingIndicator';
  div.innerHTML = `
    <div class="avatar">🤖</div>
    <div class="bubble">
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>
  `;
  chatArea.appendChild(div);
  scrollToBottom();
}

function removeTypingIndicator() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ==================== 游戏逻辑 ====================
function presentRiddle() {
  state.currentRiddle = getRandomRiddle();
  state.hintLevel = 0;
  state.solved = false;
  state.currentAttempts = 0;

  const r = state.currentRiddle;
  const html = `
    <div>🤖 机器人：来猜猜这个字谜吧！</div>
    <div class="riddle-card">
      <div class="riddle-label">✦ 谜面 ✦</div>
      <div class="riddle-text">「${r.riddle}」</div>
      <div class="riddle-hint-count">难度：${getDifficultyLabel(r.difficulty)} | 剩余提示：3次</div>
    </div>
    <div style="margin-top:6px;font-size:13px;color:var(--text-dim);">请在输入框中输入你猜的<strong>一个汉字</strong>～</div>
  `;
  addAIMessage(html);
  btnHint.disabled = false;
  btnHint.textContent = '💡 提示 (3)';
  guessInput.disabled = false;
  btnSend.disabled = false;
  guessInput.focus();
}

function submitGuess() {
  if (state.solved || !state.currentRiddle) return;

  const guess = guessInput.value.trim();
  if (!guess) {
    showToast('请输入一个汉字', 'error');
    return;
  }

  // 检查是否为汉字
  if (!/^[\u4e00-\u9fff]$/.test(guess)) {
    showToast('请输入一个汉字哦～', 'error');
    return;
  }

  addUserMessage(guess);
  guessInput.value = '';
  state.currentAttempts++;
  state.totalAttempts++;

  showTypingIndicator();

  setTimeout(() => {
    removeTypingIndicator();

    if (guess === state.currentRiddle.answer) {
      // 答对了
      handleCorrectAnswer();
    } else {
      // 答错了
      handleWrongAnswer(guess);
    }
  }, 800 + Math.random() * 600);
}

function handleCorrectAnswer() {
  state.solved = true;
  const r = state.currentRiddle;

  // 根据尝试次数和提示等级计算得分
  let points = 10;
  if (state.currentAttempts === 1) points = 20;
  else if (state.currentAttempts === 2) points = 15;
  if (state.hintLevel > 0) points -= state.hintLevel * 3;
  points = Math.max(3, points);

  state.score += points;
  updateScore();

  const emojis = ['🎉', '👏', '✨', '💯', '🏆'];
  const emoji = emojis[Math.floor(Math.random() * emojis.length)];

  const html = `
    <div style="font-size:16px;font-weight:700;color:var(--success);">${emoji} 恭喜你，答对了！</div>
    <div style="font-size:36px;font-weight:900;color:var(--gold);margin:10px 0;text-shadow:0 0 20px rgba(240,192,64,0.3);">${r.answer}</div>
    <div style="font-size:13px;color:var(--text-dim);">
      谜面：${r.riddle}<br>
      尝试次数：${state.currentAttempts} 次<br>
      获得积分：<strong style="color:var(--gold);">+${points}</strong>
    </div>
  `;
  addAIMessage(html);

  guessInput.disabled = true;
  btnSend.disabled = true;
  btnHint.disabled = true;

  // 自动出下一题
  setTimeout(() => {
    addSystemMessage('⸻  3秒后自动出新题  ⸻');
    setTimeout(presentRiddle, 2500);
  }, 1500);

  showToast(`+${points} 积分！`);
}

function handleWrongAnswer(guess) {
  const r = state.currentRiddle;
  const isClose = isSimilarChar(guess, r.answer);

  let feedback;
  if (isClose) {
    feedback = `「${guess}」—— 很接近了！再想想看～ 🤔`;
  } else if (state.currentAttempts >= 5) {
    feedback = `「${guess}」—— 已经猜了${state.currentAttempts}次了，要不要试试「提示」按钮？`;
  } else if (state.currentAttempts >= 3) {
    feedback = `「${guess}」—— 还不对哦，换个思路试试？`;
  } else {
    const phrases = [
      `「${guess}」—— 不太对哦，再想想！`,
      `「${guess}」—— 不对，换个角度试试？`,
      `「${guess}」—— 嗯…不是这个字，加油！`,
      `「${guess}」—— 差一点感觉，继续猜～`
    ];
    feedback = phrases[Math.floor(Math.random() * phrases.length)];
  }

  const html = `
    <div>${feedback}</div>
    <div style="font-size:12px;color:var(--text-dim);margin-top:4px;">已尝试 ${state.currentAttempts} 次</div>
  `;
  addAIMessage(html);
  guessInput.focus();
}

// 简单判断字形是否相近
function isSimilarChar(a, b) {
  if (a === b) return true;
  // 检查是否共享偏旁
  const radicals = ['氵', '扌', '讠', '亻', '口', '木', '火', '月', '日', '辶', '艹', '虫', '王', '石', '女', '心', '忄', '钅', '纟', '贝', '车', '马', '鱼', '鸟', '足', '雨', '门'];
  for (const r of radicals) {
    if (a.includes(r) && b.includes(r)) return true;
  }
  return false;
}

function requestHint() {
  if (state.solved || !state.currentRiddle) return;
  if (state.hintLevel >= 3) {
    showToast('提示已用完', 'error');
    return;
  }

  state.hintLevel++;
  const r = state.currentRiddle;
  let hintText;

  switch (state.hintLevel) {
    case 1:
      hintText = r.hint1;
      break;
    case 2:
      hintText = r.hint2;
      break;
    case 3:
      hintText = r.hint3;
      break;
  }

  const html = `
    <div>💡 给你一点提示：</div>
    <div class="hint-box">
      <div class="hint-level">提示 ${state.hintLevel}/3</div>
      ${hintText}
    </div>
  `;
  addAIMessage(html);

  const remaining = 3 - state.hintLevel;
  btnHint.textContent = remaining > 0 ? `💡 提示 (${remaining})` : '💡 提示已用完';
  if (remaining === 0) btnHint.disabled = true;

  // 使用提示会降低得分
  if (state.hintLevel === 1) {
    addSystemMessage('提示：使用提示会略微降低本题得分哦～');
  }

  guessInput.focus();
}

function skipRiddle() {
  if (state.solved || !state.currentRiddle) return;

  const r = state.currentRiddle;
  state.solved = true;

  const html = `
    <div style="color:var(--warning);">😅 你跳过了这道题</div>
    <div style="font-size:28px;font-weight:900;color:var(--text-dim);margin:8px 0;">${r.answer}</div>
    <div style="font-size:13px;color:var(--text-dim);">
      谜面：${r.riddle}<br>
      解析：${r.hint2}
    </div>
  `;
  addAIMessage(html);

  guessInput.disabled = true;
  btnSend.disabled = true;
  btnHint.disabled = true;

  setTimeout(() => {
    addSystemMessage('⸻  3秒后自动出新题  ⸻');
    setTimeout(presentRiddle, 2500);
  }, 1500);
}

function newGame() {
  if (state.currentRiddle && !state.solved) {
    const r = state.currentRiddle;
    state.solved = true;
    addSystemMessage(`上一题答案：${r.answer}（${r.riddle}）`);
  }
  presentRiddle();
}

function updateScore() {
  scoreDisplay.textContent = state.score;
  // 动画效果
  scoreDisplay.style.transform = 'scale(1.3)';
  setTimeout(() => { scoreDisplay.style.transform = 'scale(1)'; }, 200);
}

// ==================== 初始化 ====================
function init() {
  const welcomeHTML = `
    <div style="font-size:15px;font-weight:700;margin-bottom:6px;">欢迎来到 <span style="color:var(--gold);">汉字谜盒</span>！🎊</div>
    <div style="font-size:13px;color:var(--text-dim);line-height:1.8;">
      我是你的AI字谜机器人 🤖<br>
      我会随机出一道经典字谜，你来猜对应的汉字。<br>
      <br>
      📌 <strong>规则说明：</strong><br>
      · 每次输入<strong>一个汉字</strong>作为答案<br>
      · 每题有 <strong>3次提示</strong> 机会<br>
      · 使用提示会略微降低得分<br>
      · 首次猜对可得 <strong>20分</strong><br>
      · 可以跳过或换题<br>
      <br>
      准备好了吗？马上开始第一题！
    </div>
  `;
  addAIMessage(welcomeHTML);

  setTimeout(() => {
    presentRiddle();
  }, 1200);
}

// ==================== 事件监听 ====================
guessInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    submitGuess();
  }
});

// 输入时自动限制为单个汉字
guessInput.addEventListener('input', () => {
  const val = guessInput.value;
  // 只保留汉字
  const filtered = val.replace(/[^\u4e00-\u9fff]/g, '');
  guessInput.value = filtered.slice(0, 1);
});

// 启动游戏
init();
</script>
